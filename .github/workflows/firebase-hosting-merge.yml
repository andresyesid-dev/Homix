name: Deploy to Firebase on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Angular dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

      - name: Install Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Build Functions
        run: npm run build
        working-directory: functions

      - name: Write Firebase service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOMIX_B86F6 }}' > $HOME/gcloud-key.json

      - name: Deploy to Firebase (Hosting + Functions)
        run: npx firebase-tools deploy --only hosting,functions --project homix0523
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.HOME }}/gcloud-key.json

